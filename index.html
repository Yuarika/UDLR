<body class="intro-page">

<div class="intro-background" aria-hidden="true">
  <div class="background-grid"></div>
  <div class="background-circle circle-1"></div>
  <div class="background-circle circle-2"></div>
</div>

<main class="intro-card">

  <header class="intro-header">
    <p class="eyebrow">WEB PUZZLE<span class="eyebrow-line"></span>001</p>
    <div class="status"><span class="status-dot"></span>SYSTEM ONLINE</div>
  </header>

  <section class="intro-hero">
    <div class="hero-figure" aria-hidden="true">
      <img src="img/pict_idle.png" alt="" onerror="(this.n=(this.n||0)+1)==1?this.src='img/pict.png':(this.onerror=null,this.src='img/pict.svg')">

    <h1 class="intro-logo">上下左右</h1>

  <section class="about-section">
    <div class="section-label"><span>01</span>ABOUT</div>

        <strong>行動を選び上下左右に動きましょう！</strong><br>

    <div class="section-label"><span>02</span>ACTION</div>

      <span class="action-arrow">↗</span>
    </a>

    <a class="action-button" id="profile" href="#" target="_blank" rel="noopener noreferrer">
      <span class="action-number">03</span>
      <span class="action-main"><span class="action-title">AUTHOR PROFILE</span><span class="action-sub">作者のプロフィールを見る</span></span>
      <span class="action-arrow">↗</span>

    <div>上下左右</div>

const X_POST_URL  = "https://yuarika.github.io/UDLR/";
const X_POST_TEXT =
  "WEB謎『上下左右』に挑戦します！\n\n" +
  X_POST_URL + "\n" +
  "#Web_上下左右 #VRC_UDLR #謎解き";
const PROFILE_URL = "https://yuarika.github.io/Yuarika_Profile/";

document.getElementById("post-on-x").href =
  "https://x.com/intent/post?text=" + encodeURIComponent(X_POST_TEXT);
document.getElementById("profile").href = PROFILE_URL;
</script>
